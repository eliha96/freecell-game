<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512">
  <rect width="512" height="512" rx="96" fill="#076324" />
  <rect x="76" y="76" width="360" height="360" rx="32" fill="#0b7a2f" stroke="#22c55e" stroke-width="8" opacity="0.6"/>
  <!-- 4 mini slots top -->
  <rect x="96" y="96" width="60" height="84" rx="8" fill="#044418" stroke="#15803d" stroke-width="4"/>
  <rect x="168" y="96" width="60" height="84" rx="8" fill="#044418" stroke="#15803d" stroke-width="4"/>
  <rect x="284" y="96" width="60" height="84" rx="8" fill="#044418" stroke="#15803d" stroke-width="4"/>
  <rect x="356" y="96" width="60" height="84" rx="8" fill="#044418" stroke="#15803d" stroke-width="4"/>
  <!-- Center Playing Card -->
  <g transform="translate(176, 200) rotate(-6)">
    <rect width="160" height="224" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="6" filter="drop-shadow(0 12px 16px rgba(0,0,0,0.5))"/>
    <text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#dc2626">A</text>
    <text x="24" y="74" font-family="Arial, sans-serif" font-size="28" fill="#dc2626">♥</text>
    <text x="80" y="140" font-family="Arial, sans-serif" font-size="72" fill="#dc2626" text-anchor="middle">♥</text>
  </g>
  <!-- King overlapping -->
  <g transform="translate(230, 220) rotate(8)">
    <rect width="160" height="224" rx="16" fill="#ffffff" stroke="#cbd5e1" stroke-width="6" filter="drop-shadow(0 12px 16px rgba(0,0,0,0.5))"/>
    <text x="24" y="44" font-family="Arial, sans-serif" font-size="32" font-weight="900" fill="#0f172a">K</text>
    <text x="24" y="74" font-family="Arial, sans-serif" font-size="28" fill="#0f172a">♠</text>
    <text x="80" y="140" font-family="Arial, sans-serif" font-size="72" fill="#0f172a" text-anchor="middle">♠</text>
  </g>
</svg>
